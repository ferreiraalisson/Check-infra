<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Registro de Ocorrências</title>
  <meta name="description" content="Registre ocorrências de infraestrutura predial em segundos." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">INFRA
      <div class="icone">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="20" height="20" class="logo">
          <path d="M35,5 C55,5 75,15 85,25 C70,20 50,15 30,15 C15,15 5,10 0,5 C15,0 25,5 35,5 Z" fill="#004a80"/>
          <path d="M10,45 C30,25 60,15 100,30 C80,35 40,55 15,60 C5,60 0,55 10,45 Z" fill="#ff911a"/>
          <path d="M10,45 C0,35 5,20 20,20 C15,30 10,40 10,45 Z" fill="#ffb884" fill-opacity="0.7"/>
        </svg>
      </div>
    COPA</div>
    <nav class="nav">
      <a href="index.html" class="nav-link">Check-list</a>
      <a href="ocorrencias.html" class="nav-link active">OCORRÊNCIAS</a>
    </nav>
  </header>

  <main class="container">
    <span class="now-value" id="nowValue">—</span>
    <section class="hero">
      <h1>Novo Apontamento</h1>
    </section>
      <div class="description">
        <p class="muted">Viu algo irregular? Use o formulário abaixo para relatar qualquer problema, dano ou situação que necessite de atenção. Quanto mais detalhes você fornecer, melhor será para entender e resolver o problema.</p>
      </div>
    

    <form id="ocoForm" class="card form">
      <div class="field">
        <label for="ocoNome">NOME E SOBRENOME</label>
        <input id="ocoNome" type="text" required placeholder="Ex.: João da Silva" autocomplete="name" />
      </div>

      <div class="field">
        <label for="ocoLocal">Local</label>
        <input id="ocoLocal" type="text" required placeholder="Ex.: 5º andar - banheiro masculino" />
      </div>

      <div class="field">
        <label for="ocoTipo">Tipo de demanda</label>
        <select id="ocoTipo" required>
          <option value="">Selecione...</option>
          <option>Elétrica</option>
          <option>Hidráulica</option>
          <option>Civil</option>
          <option>Refrigeração</option>
          <option>Pintura</option>
          <option>Serviço externo</option>
          <option>Outros</option>
        </select>
      </div>

      <div class="field">
        <label for="ocoDescricao">Descrição</label>
        <textarea id="ocoDescricao" rows="4" required placeholder="Descreva brevemente o que observou."></textarea>
      </div>

      <div class="field">
        <label for="ocoFoto">Foto (opcional)</label>
        <input id="ocoFoto" type="file" accept="image/*" capture="environment" />
        <img class="photo-preview" id="ocoFotoPreview" alt="Pré-visualização" />
      </div>

      <button class="btn primary block" type="submit">ENVIAR OCORRÊNCIA</button>
    </form>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ocorrencias.js"></script>
</body>
</html>
