<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <link rel="icon" href="https://img.icons8.com/?size=30&id=IqYejp8HuOoA&format=png&color=f7941d" sizes="32x32">
  <title>ZeloInfra</title>
  <meta name="description" content="Check-list de manutenção predial — registro rápido pelo celular." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">ZELO
      <div class="icone">
        <img src="https://img.icons8.com/?size=20&id=IqYejp8HuOoA&format=png&color=f7941d" alt="Ícone de construção">
      </div>
    INFRA</div>
    <nav class="nav">
      <a href="index.html" class="nav-link active">CHECK-LIST</a>
      <a href="ocorrencias.html" class="nav-link">Ocorrências</a>
    </nav>
  </header>

  <main class="container">
    <span class="now-value" id="nowValue">—</span>
    <section class="hero">
      <h1>CHECAGEM OPERACIONAL</h1>
      <div class="description">
        <p class="muted">Seção para registrar a conferência dos pontos de atenção da infraestrutura da unidade. Toque no item, marque a condição e envie.</p>
      </div>
      <div class="user-row">
        <label for="userName">NOME E SOBRENOME</label>
        <input id="userName" type="text" placeholder="Ex.: João da Silva" autocomplete="name" />
      </div>
      <div class="filters" id="filterBar"></div>
    </section>

    <section id="checklistGrid" class="grid"></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Modal de registro -->
  <div id="modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head">
        <h2 id="modalTitle">REGISTRAR</h2>
        <button class="icon-btn" id="closeModal" aria-label="Fechar">✕</button>
      </header>
      <div class="modal-body" id="modalBody"></div>
      <footer class="modal-foot">
        <button class="btn ghost" id="cancelBtn">Cancelar</button>
        <button class="btn primary" id="saveBtn">Salvar registro</button>
      </footer>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/checklist-data.js"></script>
  <script src="js/checklist.js"></script>
</body>
</html>
